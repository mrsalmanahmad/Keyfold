name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security vulnerability instead? Please don't file it here — use the
        [private vulnerability report](../../security/advisories/new) form instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps so a maintainer can hit the same bug.
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Keyfold version / commit
      placeholder: e.g. 0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 131 on Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant console / service worker logs
      description: chrome://extensions → Keyfold → "service worker" → Inspect. Redact anything sensitive.
      render: shell
